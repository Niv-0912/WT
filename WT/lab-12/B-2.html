<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Number</title>
</head>
<body>

<script>
    let n = Number(prompt("Enter a number:"));
    let original = n;
    let reverse = 0;

    while (n > 0) {
        let digit = n % 10;
        reverse = reverse * 10 + digit;
        n = Math.floor(n / 10);
    }

    if (original === reverse) {
        alert(original + " is a Palindrome Number");
    } else {
        alert(original + " is not a Palindrome Number");
    }
</script>

</body>
</html>
