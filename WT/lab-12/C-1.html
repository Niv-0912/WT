<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>
</head>
<body>

<script>
    var n = Number(prompt("Enter a number:"));
    var original = n;
    var sum = 0;
    var digits = n.toString().length;

    while (n > 0) {
        var digit = n % 10;
        sum = sum + Math.pow(digit, digits);
        n = Math.floor(n / 10);
    }

    if (sum === original) {
        alert(original + " is an Armstrong Number");
    } else {
        alert(original + " is not an Armstrong Number");
    }
</script>

</body>
</html>
