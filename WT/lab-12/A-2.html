<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     
    <script>
        var a =Number(prompt("Enter number."));
        var i;

        for (i=1;i<=a;i++)
        {
            if(i%a==0)
            {
                alert("Number is not prime");
            }
            else{
                alert("Number is  prime ");
            }
        }

    </script>
</body>
</html>
