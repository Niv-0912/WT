<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        var arr = [10,70,20,40,50];

        document.writeln("Push: " + arr.push(60)+"<br>");
        document.writeln("Pop: " + arr.pop()+"<br>");
        document.writeln("Unshift: " + arr.unshift(60)+"<br>");
        document.writeln("Shift: " + arr.shift()+"<br>");
        document.writeln("Splice: " + arr.splice(3)+"<br>");
        document.writeln("Sort: " + arr.sort()+"<br>");

    </script>

</body>
</html>
