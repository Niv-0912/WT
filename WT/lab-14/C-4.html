<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
        <script>
            // var arr =;
            function quicksort(arr){       

                if(arr.length <=1){
                return arr;
            }
           
            let pivot = arr[arr.length-1];
            let left = [];
            let right = [];


            for(let i=0; i<arr.length-1;i++){

                if(arr[i] < pivot){
                    left.push(arr[i]);
                }
                else{
                    right.push(arr[i]);
                }
                
            }

            return quicksort(left).concat(pivot,quicksort(right));
        

        }
        // let sort_arry = quicksort([10,90,20,1]);
        // alert("Arra: " + sort_arry);
        var sortArr = quicksort([10,90,20,1]);
        document.write(`Sortef array is :- ${sortArr}`);
        </script>
</body>
</html>
