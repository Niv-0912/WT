<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <script>
       
            
            var arr = [10,90,20,1];
           

            for(let i=0; i<arr.length;i++){

                for(let j=0; j<arr.length-i-1; j++){

                    if(arr[j] > arr[j+1]){

                        temp = arr[j+1];
                        arr[j+1] = arr[j];
                        arr[j] = temp;
                    
                    }

                }
            }

            alert("sort : " + arr);
        

    </script>
</body>
</html>
