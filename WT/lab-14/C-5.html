<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        var sentance = ["hello","word","du"];

        var word = "du";
        var index = -1;

        for(let i=0; i<sentance.length; i++);
        {
            if(word == sentance[i]){

                index = i;
            }
        }

        document.write(`index is :- ${index}`);

    </script>
</body>
