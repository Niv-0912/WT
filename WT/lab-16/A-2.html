        <script>
        function login(){
            var nm = document.getElementById("name");
        
            var pass = Number(document.getElementById("password").value); 
            
            if(pass === 123){
                alert("Login !!");
            } else {
                alert("Invalid password!!");
            }
        }
        </script>
