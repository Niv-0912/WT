<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorier</title>
</head>
<body>
    <form onsubmit="fact();">
        Number:
        <input type="number" id="nm">
        <button type="submit">Submit</button>
    </form>
    
    <script>
        function fact() {
            var num = Number(document.getElementById("nm").value);
            for (let i = 1; i <= num; i++) {
                if (num % i === 0) { 
                    document.writeln(i);
                }
            }
        }
    </script>
</body>
</html>
