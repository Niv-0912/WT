<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorier</title>
</head>
<body>
    <form onsubmit="prime();">
        Number1: <input type="number" id="nm">
        Number2: <input type="number" id="nm2">
        <button type="submit">Submit</button>
    </form>
    
    <div id="result"></div>

    <script>
        function prime() {
             
            var num = Number(document.getElementById("nm").value);
            var num2 = Number(document.getElementById("nm2").value); 
            
            let output = "";
            for (let n = num; n <= num2; n++) {
                let count = 0;
                for (let i = 1; i <= n; i++) {
                    if (n % i === 0) {
                        count++;
                    }
                }
                if (count === 2) {
                    output += n;
                }
            }
            document.getElementById("result").innerHTML = output;
        }
    </script>
</body>
</html>
